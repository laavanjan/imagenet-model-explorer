name: Deploy to Hugging Face Space

# Mirrors hf_space/ (plus the shared classifier.py) to the Space whenever they change on main.
on:
  push:
    branches: [main]
    paths:
      - hf_space/**
      - classifier.py
      - .github/workflows/deploy-hf-space.yml
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_USER: Laavanjan
      HF_SPACE: image-classifier
    steps:
      - uses: actions/checkout@v4
      - name: Push files to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Add a repository secret named HF_TOKEN (a Hugging Face Write token)."; exit 1; fi
          git clone "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" space
          rsync -a --delete --exclude '.git' --exclude '.gitattributes' hf_space/ space/
          cp classifier.py space/classifier.py   # single source of truth for the engine
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Space already up to date."; exit 0; fi
          git commit -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push origin HEAD:main
