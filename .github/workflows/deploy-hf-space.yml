name: Deploy to Hugging Face Space

# Mirrors the app (app.py, classifier.py, requirements.txt, examples/) plus the Space card in hf_space/README.md
# to the Hugging Face Space whenever they change on main.
on:
  push:
    branches: [main]
    paths:
      - app.py
      - classifier.py
      - requirements.txt
      - examples/**
      - hf_space/**
      - .github/workflows/deploy-hf-space.yml
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_USER: Laavanjan
      HF_SPACE: image-classifier
    steps:
      - uses: actions/checkout@v4
      - name: Push files to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Add a repository secret named HF_TOKEN (a Hugging Face Write token)."; exit 1; fi
          git clone "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" space
          find space -mindepth 1 -maxdepth 1 ! -name .git ! -name .gitattributes -exec rm -rf {} +
          cp app.py classifier.py requirements.txt space/
          cp -r examples space/examples
          cp hf_space/README.md space/README.md   # the Space card (title, SDK and version)
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Space already up to date."; exit 0; fi
          git commit -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push origin HEAD:main
