name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Cache pretrained weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-weights-resnet50-convnext-tiny
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test the Gradio app
        run: |
          GRADIO_SERVER_PORT=7860 python app.py &
          for i in $(seq 1 90); do
            curl -fs -o /dev/null http://localhost:7860/ && echo "app is up" && exit 0
            sleep 2
          done
          echo "app did not start" && exit 1
